name: pdf
on:
  push:
  pull_request:

jobs:
  bytecode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gerar listagens javap (se o script existir)
        run: |
          if [ -x scripts/gen-bytecode.sh ]; then scripts/gen-bytecode.sh; else echo "gen-bytecode.sh ausente; pulando"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: generated
          path: latex/generated
          if-no-files-found: ignore

  pdf:
    needs: bytecode
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: generated
          path: latex/generated
      - name: Compilar
        working-directory: latex
        run: latexmk -interaction=nonstopmode -halt-on-error main.tex
      - name: Checar
        run: scripts/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: apostila
          path: latex/build/apostila.pdf

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress 'latex/**/*.tex' 'latex/bib/*.bib'
          fail: true

  site:
    # valida o site em PRs e pushes (sem deploy)
    needs: pdf
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apostila
          path: pdf
      - name: Instalar pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Gerar site
        run: scripts/build-site.sh pdf/apostila.pdf
      - name: Testar site
        run: scripts/test-site.sh

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: pdf
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apostila
          path: pdf
      - name: Montar assets e notas
        run: |
          v="${TAG#v}"
          cp pdf/apostila.pdf "apostila-$TAG.pdf"
          scripts/package-latex.sh "$TAG"
          # notas: seção [X.Y.Z] do CHANGELOG.md
          awk -v v="$v" '
            /^## \[/ { if (em) exit; em = (index($0, "[" v "]") > 0); next }
            em { print }
          ' CHANGELOG.md > notas.md
          [ -s notas.md ] || { echo "Seção [$v] ausente ou vazia no CHANGELOG.md" >&2; exit 1; }
      - name: Criar release
        run: |
          gh release create "$TAG" "apostila-$TAG.pdf" "dist/apostila-latex-$TAG.zip" \
            --title "Apostila $TAG" --notes-file notas.md

  pages:
    # release é pulado em push na main; always() deixa o deploy seguir nesse caso
    if: >-
      always() && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      && needs.site.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    needs: [site, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apostila
          path: pdf
      - name: Instalar pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Gerar e testar site (já com a release recém-criada)
        run: |
          scripts/build-site.sh pdf/apostila.pdf
          scripts/test-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
