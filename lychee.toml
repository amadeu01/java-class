# Configuração do lychee (job `links` do CI).
accept = ["200", "429"]
timeout = 30
max_retries = 3

# Exclusões por domínio: o blog da Netflix (e o espelho no Medium) responde 403
# a IPs de CI (bloqueio de bot) embora as páginas existam. Esses links são
# verificados manualmente na etapa de peer review. 403 NÃO é aceito globalmente.
exclude = [
  '^https://netflixtechblog\.com/',
  '^https://netflixtechblog\.medium\.com/',
  '^https://techblog\.netflix\.com/',
  # O'Reilly responde 403 a acesso automatizado; a página do livro foi
  # conferida pelo índice de busca (título, autores, edição de 2016).
  '^https://www\.oreilly\.com/',
  # Loja do Grupo A (Bookman, edições PT): responde 403 "Loja em manutenção"
  # a clientes que não são navegador; com navegador a página abre (conferida
  # em 2026-10-19). Verificado manualmente no peer review.
  '^https://loja\.grupoa\.com\.br/',
]

# A ACM Digital Library responde 403 a robôs, e os DOIs 10.1145 redirecionam
# para ela. Em vez de excluí-los, o lychee checa o registro do mesmo DOI no
# Crossref: se o DOI não existir, o link falha.
#
# O mesmo vale para IEEE (10.1109, responde 202/418 a robôs), Elsevier
# (10.1016) e Wiley (10.1002, responde 403): o DOI é conferido no Crossref.
remap = [
  '^https://doi\.org/(10\.1145/.+)$ https://api.crossref.org/works/$1',
  '^https://doi\.org/(10\.1109/.+)$ https://api.crossref.org/works/$1',
  '^https://doi\.org/(10\.1016/.+)$ https://api.crossref.org/works/$1',
  '^https://doi\.org/(10\.1002/.+)$ https://api.crossref.org/works/$1',
]
